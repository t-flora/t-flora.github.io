name: Check links

# Weekly check for broken links in the built site. External links rot quietly, so this
# opens (or updates) an issue with the report instead of blocking deploys.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --no-progress
            --exclude-path dist/404.html
            --max-retries 3
            --accept 200..=299,403,429
            --exclude "^https?://(www\.)?(x|twitter|linkedin)\.com"
            "dist/**/*.html"
          fail: false

      - name: Open an issue with the report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken-links
